<style>
/* Sistem desain (dari skill ui-ux-pro-max): Claymorphism untuk aplikasi anak. Tebal, bulat 20-28px, bayangan ganda lembut, tekan lembut 180ms.
   Palet hijau, emas lembut, putih, arang dari desain sekolah; biru/ungu/merah muda hanya untuk membedakan 6 jilid.
   Huruf bacaan: Andika (a dan g satu lantai, dirancang untuk anak belajar membaca). Judul: Baloo 2. */
:root {
  --bg: #f4f8f0;
  --surface: #ffffff;
  --surface-2: #eef4ea;
  --ink: #22302a;
  --muted: #566559;
  --line: #d3dfcd;
  --ring: #2563eb;
  --green: #2e7d52;
  --green-soft: #dcefe3;
  --on-green: #ffffff;
  --gold: #f2c14e;
  --gold-soft: #fbf0c9;
  --on-gold: #22302a;
  --danger: #b3402f;
  --danger-soft: #f8e3de;
  --shade: 34 48 42;
  --hi: 255 255 255 / 0.75;
  --j1: #2e7d52; --j2: #2563eb; --j3: #be2e78; --j4: #b45309; --j5: #0f766e; --j6: #6d4bd8;
  --on-j: #ffffff;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-read: "Andika", "Comic Sans MS", "Segoe UI", system-ui, sans-serif;
  --dur: 180ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --r-lg: 26px;
  --r-md: 20px;
  --r-sm: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141a17; --surface: #1d2521; --surface-2: #252f2a; --ink: #eaf0ea; --muted: #a5b2aa; --line: #38463f;
    --ring: #8fb3ff; --green: #5fc08b; --green-soft: #1e3a2b; --on-green: #0e1f15;
    --gold: #e8b94a; --gold-soft: #3b3219; --on-gold: #1a1a12;
    --danger: #ee9686; --danger-soft: #3d2420; --shade: 0 0 0; --hi: 255 255 255 / 0.07;
    --j1: #5fc08b; --j2: #86a9ff; --j3: #f08ab8; --j4: #f0a04b; --j5: #4fd1c0; --j6: #ab94ff;
    --on-j: #10181a;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-read); font-size: 1rem; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
}
.shell { max-width: 880px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 2.7rem); }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
h1:focus { outline: none; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--ring); outline-offset: 3px; border-radius: 10px; }
.ic { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.fill { fill: currentColor; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 20px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }

/* Clay */
.clay {
  background: var(--surface); border: 3px solid var(--line); border-radius: var(--r-lg);
  box-shadow: 0 12px 22px -12px rgb(var(--shade) / 0.35), inset 0 -5px 0 rgb(var(--shade) / 0.07), inset 0 4px 0 rgb(var(--hi));
}
.press { transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease), background-color var(--dur) var(--ease); }
.press:hover { border-color: var(--green); }
.press:active { transform: translateY(2px); box-shadow: 0 6px 12px -10px rgb(var(--shade) / 0.35), inset 0 -2px 0 rgb(var(--shade) / 0.07), inset 0 3px 0 rgb(var(--hi)); }

/* Bar atas */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--green); }
.brand .mark { width: 42px; height: 42px; border-radius: 14px; background: var(--green); color: var(--gold); display: grid; place-items: center; box-shadow: inset 0 -3px 0 rgb(0 0 0 / 0.18); }
.brand .mark .ic { width: 24px; height: 24px; }
.sound { min-height: 48px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; }
.sound[aria-pressed="false"] { color: var(--muted); }

/* Navigasi bawah */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--bg); border-top: 3px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav-in { max-width: 880px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.nav a { min-height: 56px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; color: var(--muted); border: 3px solid transparent; }
.nav a[aria-current="page"] { background: var(--green); color: var(--on-green); box-shadow: inset 0 -4px 0 rgb(0 0 0 / 0.18); }
.nav a:not([aria-current]):hover { background: var(--surface-2); }

.back { display: inline-flex; align-items: center; gap: 4px; min-height: 48px; padding-right: 14px; font-weight: 700; color: var(--green); }
.lead { color: var(--muted); margin-top: 8px; max-width: 60ch; }
.banner { border: 3px solid var(--gold); background: var(--gold-soft); border-radius: var(--r-md); padding: 12px 16px; font-size: 0.95rem; }

/* Tombol */
.btn { min-height: 52px; padding: 0 22px; border-radius: var(--r-md); border: 3px solid var(--green); background: var(--green); color: var(--on-green); font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 8px 14px -8px rgb(var(--shade) / 0.45), inset 0 -4px 0 rgb(0 0 0 / 0.18), inset 0 3px 0 rgb(255 255 255 / 0.2); }
.btn.alt { background: var(--surface); color: var(--green); box-shadow: 0 8px 14px -10px rgb(var(--shade) / 0.35), inset 0 -4px 0 rgb(var(--shade) / 0.07); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 1rem; }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(2px); }
.btn:disabled { opacity: 0.55; cursor: default; }
.link { background: none; border: none; min-height: 44px; padding: 0 6px; font-weight: 700; color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.link.danger { color: var(--danger); }
.link.muted { color: var(--muted); }

/* Beranda */
.who { display: flex; flex-wrap: wrap; gap: 10px; }
.who button { min-height: 52px; padding: 0 18px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; border: 3px solid var(--line); background: var(--surface); }
.who button[aria-checked="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); box-shadow: inset 0 -4px 0 rgb(0 0 0 / 0.12); }
.jgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.jcard { padding: 18px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.jcard .no { width: 64px; height: 64px; border-radius: 20px; background: var(--jc); color: var(--on-j); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 2.2rem; line-height: 1; box-shadow: inset 0 -4px 0 rgb(0 0 0 / 0.2); margin-bottom: 4px; }
.jcard .nm { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; }
.jcard .ds { color: var(--muted); font-size: 0.95rem; }
.meter { height: 12px; border-radius: 999px; background: var(--surface-2); border: 2px solid var(--line); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; background: var(--jc, var(--green)); border-radius: 999px; }
.jcard .pt { font-size: 0.85rem; color: var(--muted); }

/* Daftar materi */
.title-row { display: flex; align-items: center; gap: 14px; }
.title-row .no { width: 60px; height: 60px; border-radius: 20px; background: var(--jc); color: var(--on-j); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 2rem; box-shadow: inset 0 -4px 0 rgb(0 0 0 / 0.2); flex: none; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 12px; }
.mtile { min-height: 112px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; min-width: 0; border-radius: var(--r-md); }
.mtile .jd { font-weight: 700; font-size: 1.5rem; line-height: 1.15; overflow-wrap: anywhere; }
.mtile .hl { font-size: 0.8rem; color: var(--muted); }
.mtile.bacaan { grid-column: span 2; border-style: dashed; }
.mtile.bacaan .jd { font-size: 1.15rem; }
.mtile.done { background: var(--green-soft); border-color: var(--green); }
.stars { display: inline-flex; gap: 2px; }
.star { width: 18px; height: 18px; fill: var(--line); stroke: none; }
.star.on { fill: var(--gold); stroke: rgb(var(--shade) / 0.25); stroke-width: 1; }
.stars.big .star { width: 44px; height: 44px; }
.pop .star.on { animation: pop 420ms var(--ease) both; }
.pop .star.on:nth-child(2) { animation-delay: 120ms; }
.pop .star.on:nth-child(3) { animation-delay: 240ms; }
@keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }

/* Latihan */
.targets { display: flex; flex-wrap: wrap; gap: 12px; }
.target { min-width: 96px; min-height: 96px; padding: 8px 22px; border-radius: var(--r-lg); border: 3px solid var(--gold); background: var(--gold-soft); color: var(--ink); font-family: var(--font-read); font-weight: 700; font-size: 3rem; line-height: 1.2;
  box-shadow: 0 10px 16px -10px rgb(var(--shade) / 0.4), inset 0 -5px 0 rgb(var(--shade) / 0.08), inset 0 4px 0 rgb(255 255 255 / 0.5); }
.kata { display: inline-flex; align-items: center; gap: 10px; padding: 6px 8px 6px 18px; border-radius: 999px; font-size: 1.1rem; }
.kata b { font-size: 1.3rem; }
.sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.rows { display: flex; flex-direction: column; gap: 12px; }
.line { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); }
.toks { display: flex; flex-wrap: wrap; gap: 4px 8px; flex: 1; min-width: 0; }
.tok { border: none; background: none; min-height: 52px; border-radius: 14px; padding: 0 12px; font-family: var(--font-read); font-weight: 700; font-size: 2.1rem; line-height: 1.3; color: var(--ink); transition: background-color var(--dur) var(--ease); }
.tok.t { color: var(--green); }
.tok:hover { background: var(--surface-2); }
.tok.on { background: var(--gold); color: var(--on-gold); }
.play { flex: none; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--green); background: var(--surface); color: var(--green); display: grid; place-items: center; padding: 0; }
.play .ic { width: 22px; height: 22px; }

/* Kuis */
.quiz { display: flex; flex-direction: column; gap: 16px; }
.qtop { display: flex; flex-direction: column; gap: 6px; }
.qbox { padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.qbox .ask { font-size: 1.2rem; font-weight: 700; }
.qbox .hintx { font-size: 2.6rem; font-weight: 700; color: var(--green); line-height: 1.2; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.opt { min-height: 104px; border-radius: var(--r-lg); border: 3px solid var(--line); background: var(--surface); font-family: var(--font-read); font-weight: 700; font-size: 2.6rem; padding: 4px; min-width: 0; overflow-wrap: anywhere;
  box-shadow: 0 10px 16px -10px rgb(var(--shade) / 0.35), inset 0 -5px 0 rgb(var(--shade) / 0.07), inset 0 4px 0 rgb(var(--hi)); }
.opt.ok { background: var(--green); border-color: var(--green); color: var(--on-green); }
.opt.no { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.opt:disabled { cursor: default; }
.fb { min-height: 1.6em; font-weight: 700; text-align: center; font-size: 1.1rem; }
.fb.ok { color: var(--green); }
.fb.no { color: var(--danger); }
.result { padding: 26px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; border-color: var(--gold); }
.result .sc { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; line-height: 1; }
.info { padding: 20px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; border-style: dashed; }

/* Guru */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.stile { padding: 12px; display: flex; flex-direction: column; gap: 2px; border-radius: var(--r-md); min-width: 0; }
.stile .t1 { display: flex; justify-content: space-between; align-items: baseline; }
.stile .nm { font-family: var(--font-display); font-weight: 700; color: var(--jc); }
.stile .cnt { font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stile .ex { font-size: 0.8rem; color: var(--muted); }
.stile.has { border-color: var(--gold); background: var(--gold-soft); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; }
.field input { min-height: 52px; padding: 0 16px; border-radius: var(--r-md); border: 3px solid var(--line); background: var(--surface); font: inherit; color: var(--ink); }
.field input:focus-visible { border-color: var(--ring); outline-offset: 2px; }
.field .err { color: var(--danger); font-weight: 700; font-size: 0.9rem; }
.add { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
.list { display: flex; flex-direction: column; gap: 14px; }
.siswa { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.siswa.open { border-color: var(--green); }
.s-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.s-name { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; margin-right: auto; min-width: 0; overflow-wrap: anywhere; }
.pos { font-size: 0.85rem; font-weight: 700; border-radius: 999px; padding: 3px 12px; background: var(--surface-2); color: var(--muted); border: 2px solid var(--line); }
.pos.prog { background: var(--gold-soft); color: var(--ink); border-color: var(--gold); }
.pos.done { background: var(--green-soft); color: var(--green); border-color: var(--green); }
.bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.bar { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.bar .lbl { font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.bar .meter { margin-top: 0; height: 10px; }
.tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.tab { min-height: 48px; border-radius: var(--r-sm); border: 3px solid var(--line); background: var(--surface); font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--jc); border-color: var(--jc); color: var(--on-j); box-shadow: inset 0 -3px 0 rgb(0 0 0 / 0.2); }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.chip { min-height: 64px; border-radius: var(--r-sm); border: 3px solid var(--line); background: var(--surface-2); padding: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.2; min-width: 0; transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.chip .j { font-weight: 700; font-size: 1rem; overflow-wrap: anywhere; }
.chip .h { font-size: 0.75rem; color: var(--muted); }
.chip .st { font-size: 0.7rem; font-weight: 700; }
.chip.bacaan { grid-column: span 2; border-style: dashed; }
.chip.s1 { background: var(--gold-soft); border-color: var(--gold); }
.chip.s2 { background: var(--green); border-color: var(--green); color: var(--on-green); }
.chip.s2 .h { color: var(--on-green); opacity: 0.85; }
.chip:disabled { cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 0.9rem; align-items: center; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 5px; border: 2px solid var(--line); background: var(--surface-2); vertical-align: -2px; margin-right: 6px; }
.legend i.g { background: var(--gold-soft); border-color: var(--gold); }
.legend i.v { background: var(--green); border-color: var(--green); }
.note { width: 100%; min-height: 48px; padding: 0 14px; border: 3px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); font: inherit; color: var(--ink); }
.note::placeholder { color: var(--muted); }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 0 10px; align-items: center; font-weight: 700; }
.empty { padding: 28px 18px; text-align: center; border-style: dashed; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.2rem; margin-bottom: 4px; }
.backup { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

@media (max-width: 520px) {
  .opts { gap: 8px; }
  .opt { font-size: 2.1rem; min-height: 96px; }
  .tok { font-size: 1.8rem; padding: 0 8px; }
  .add { grid-template-columns: 1fr; }
  .add .btn { width: 100%; }
  .bars { gap: 6px; }
  .tabs { gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

      (TTS ? '<button type="button" class="btn alt sm" data-act="playall">' + ico("play", "fill") + "Putar semua</button>" : "") +
      '<button type="button" class="btn alt sm" data-act="newlines">' + ico("refresh") + "Baris baru</button></div></div>" +
      '<p class="muted" style="margin:6px 0 12px">Ketuk suku kata untuk mendengarnya. Sambil membaca, tunjuk dengan jari telunjuk.</p><div class="rows" id="rows">' + rowsHtml(m) + "</div></section>" +
      '<section aria-labelledby="qH" class="sec-head"><h2 id="qH">Tebak suku kata</h2><button type="button" class="btn" data-act="quiz">Mulai tebak</button></section></div>';
  }
  function vKuis(m) {
    var back = '<a class="back" href="#/materi/' + m.id + '">' + ico("left") + esc(m.judul) + "</a>";
    if (Q.done) {
      var st = starsFromScore(Q.score);
      var msg = st === 3 ? "Hebat sekali!" : st === 2 ? "Bagus!" : st === 1 ? "Lumayan, ayo coba lagi." : "Ayo berlatih lagi, pasti bisa.";
      return '<div class="stack">' + back + '<h1 tabindex="-1" class="sr">Hasil tebak</h1><div class="result clay"><span class="sc">' + Q.score + ' dari 5</span><span class="pop">' + starsHtml(st, true) + '</span><p style="font-weight:700;font-size:1.2rem">' + msg + "</p>" +
        '<div class="row-wrap" style="justify-content:center"><button type="button" class="btn" data-act="quiz">' + ico("refresh") + 'Ulangi</button><a class="btn alt" href="#/materi/' + m.id + '">Kembali berlatih</a></div></div></div>';
    }

      (Q.hint ? "" : '<button type="button" class="btn alt" data-act="hint">Tampilkan petunjuk</button>') + "</div>" + (Q.hint ? '<span class="hintx" aria-label="Petunjuk: ' + esc(it.ans) + '">' + esc(it.ans) + "</span>" : "") :
      '<h1 tabindex="-1" class="ask" style="font-family:var(--font-read);font-size:1.2rem">Mana yang dibaca</h1><span class="hintx">' + esc(it.ans) + "</span>";
    var opts = it.opts.map(function (o) {

    }).join("");

  /* ---------- Tampilan Guru ---------- */
  var G = { open: null, j: 1, del: null, clear: null, err: "", pending: null, msg: "" };
  function started(s) { return Object.keys(s.nilai).length > 0; }
  function posisi(s) { for (var i = 0; i < ALL.length; i++) if (s.nilai[ALL[i].id] !== 2) return ALL[i]; return null; }
  function lancarJ(s, j) { return BY_J[j].filter(function (m) { return s.nilai[m.id] === 2; }).length; }
  function chipsHtml(s, j) {
    return BY_J[j].map(function (m) {
      var v = s.nilai[m.id] || 0;
      return '<button type="button" class="chip s' + v + (m.jenis === "bacaan" ? " bacaan" : "") + '" data-act="chip" data-id="' + esc(s.id) + '" data-m="' + esc(m.id) + '" aria-label="' + esc(m.judul) + ", halaman " + m.hal + ": " + STATE_LABEL[v] + '. Ketuk untuk mengubah.">' +
        '<span class="j">' + esc(m.judul) + '</span><span class="h">hal. ' + m.hal + '</span><span class="st">' + (v === 2 ? "lancar" : v === 1 ? "berlatih" : "&nbsp;") + "</span></button>";
    }).join("");
  }
  function cardHtml(s) {
    var p = posisi(s), posTxt, posCls;
    if (!p) { posTxt = "Tuntas semua jilid"; posCls = "done"; }
    else if (!started(s)) { posTxt = "Belum mulai"; posCls = ""; }
    else { posTxt = "Jilid " + p.j + " · " + p.judul + " (hal. " + p.hal + ")"; posCls = "prog"; }
    var open = G.open === s.id, bars = "", j;
    for (j = 1; j <= 6; j++) { var tot = BY_J[j].length, n = lancarJ(s, j); bars += '<div class="bar" style="' + jc(j) + '"><div class="lbl"><span>J' + j + "</span><span>" + n + "/" + tot + '</span></div><div class="meter" aria-hidden="true"><i style="width:' + Math.round(n / tot * 100) + '%"></i></div></div>'; }
    var head = '<div class="s-head"><h3 class="s-name">' + esc(s.nama) + '</h3><span class="pos ' + posCls + '">' + esc(posTxt) + '</span><button type="button" class="link" data-act="toggle" data-id="' + esc(s.id) + '" aria-expanded="' + open + '">' + (open ? "Tutup" : "Buka") + "</button></div>";
    var body = "";
    if (open) {
      var tabs = "";
      for (j = 1; j <= 6; j++) tabs += '<button type="button" class="tab" role="tab" style="' + jc(j) + '" aria-selected="' + (j === G.j) + '" data-act="tab" data-j="' + j + '" aria-label="Jilid ' + j + '">' + j + "</button>";
      var n2 = lancarJ(s, G.j), tot2 = BY_J[G.j].length;
      var ck = s.id + ":" + G.j;
      var bulk = '<div class="row-wrap"><button type="button" class="link" data-act="allok" data-id="' + esc(s.id) + '">Tandai semua lancar</button>' +
        (G.clear === ck ? '<span class="confirm">Kosongkan jilid ' + G.j + '? <button type="button" class="link danger" data-act="clearyes" data-id="' + esc(s.id) + '">Ya, kosongkan</button><button type="button" class="link muted" data-act="clearno">Batal</button></span>' :
          '<button type="button" class="link muted" data-act="clear" data-id="' + esc(s.id) + '">Kosongkan jilid ini</button>') + "</div>";
      var tgl = "";
      if (s.diperbarui) { var d = new Date(s.diperbarui); if (!isNaN(d)) tgl = '<span class="muted" style="font-size:0.85rem">Diperbarui ' + d.toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }) + "</span>"; }
      var del = G.del === s.id ? '<span class="confirm">Hapus siswa ini? <button type="button" class="link danger" data-act="delyes" data-id="' + esc(s.id) + '">Ya, hapus</button><button type="button" class="link muted" data-act="delno">Batal</button></span>' :
        '<button type="button" class="link danger" data-act="del" data-id="' + esc(s.id) + '">' + "Hapus siswa</button>";
      body = '<div class="tabs" role="tablist" aria-label="Pilih jilid">' + tabs + '</div><div class="sec-head"><h4 style="margin:0;font-family:var(--font-display);font-size:1.1rem">Jilid ' + G.j + " · " + esc(FOKUS_GURU[G.j - 1]) + '</h4><span class="muted">' + n2 + " dari " + tot2 + " lancar</span></div>" +
        '<div class="chips" role="tabpanel">' + chipsHtml(s, G.j) + "</div>" + bulk +
        '<div class="field"><label for="note-' + esc(s.id) + '">Catatan untuk ' + esc(s.nama) + '</label><input class="note" id="note-' + esc(s.id) + '" type="text" maxlength="200" data-id="' + esc(s.id) + '" value="' + esc(s.catatan) + '" placeholder="Contoh: masih tertukar b dan d"></div>' +
        '<div class="sec-head">' + tgl + del + "</div>";
    }
    return '<article class="siswa clay' + (open ? " open" : "") + '">' + head + '<div class="bars">' + bars + "</div>" + body + "</article>";
  }
  function vGuru() {
    var counts = [0, 0, 0, 0, 0, 0], belum = 0, tuntas = 0;
    store.siswa.forEach(function (s) { var p = posisi(s); if (!p) tuntas++; else if (!started(s)) belum++; else counts[p.j - 1]++; });
    var tiles = counts.map(function (c, i) { return '<div class="stile clay' + (c ? " has" : "") + '" style="' + jc(i + 1) + '"><div class="t1"><span class="nm">Jilid ' + (i + 1) + '</span><span class="cnt">' + c + '</span></div><span class="ex">' + esc(FOKUS_GURU[i]) + "</span></div>"; }).join("");
    var list = store.siswa.length ?
      store.siswa.slice().sort(function (a, b) { return a.nama.localeCompare(b.nama, "id"); }).map(cardHtml).join("") :
      '<div class="empty clay"><strong>Belum ada siswa</strong>Ketik nama siswa di kolom di atas, lalu tekan Tambah.</div>';
    var pend = "";
    if (G.pending) pend = '<div class="banner">Pulihkan <b>' + G.pending.siswa.length + ' siswa</b> dari file? Data siswa saat ini akan diganti. <span class="confirm"><button type="button" class="link" data-act="impyes">Ya, pulihkan</button><button type="button" class="link muted" data-act="impno">Batal</button></span></div>';
    return '<div class="stack"><div><h1 tabindex="-1">Ruang guru</h1><p class="lead">Catatan kemajuan membaca tiap siswa, mengikuti buku Baca Cepat jilid 1–6. Hasil tebak di menu Belajar mengisi catatan ini otomatis.</p></div>' +
      '<section aria-labelledby="rH"><h2 id="rH" style="margin-bottom:10px">Siswa per jilid</h2><div class="tiles">' + tiles + '</div><p class="muted" style="margin-top:10px">' + store.siswa.length + " siswa · " + belum + " belum mulai · " + tuntas + " tuntas semua jilid. Angka di tiap jilid adalah siswa yang sekarang berlatih di jilid itu.</p></section>" +
      '<form class="add" id="addForm" novalidate><div class="field"><label for="newName">Nama siswa baru</label><input id="newName" type="text" maxlength="60" autocomplete="off"' + (G.err ? ' aria-invalid="true" aria-describedby="nameErr"' : "") + ">" + (G.err ? '<span class="err" id="nameErr">' + esc(G.err) + "</span>" : "") + '</div><button type="submit" class="btn">' + ico("plus") + "Tambah</button></form>" +
      '<section aria-labelledby="sH"><div class="sec-head" style="margin-bottom:10px"><h2 id="sH">Daftar siswa</h2><div class="legend" aria-label="Arti warna"><span><i></i>belum</span><span><i class="g"></i>berlatih</span><span><i class="v"></i>lancar</span></div></div><div class="list">' + list + "</div></section>" +
      '<section class="backup clay" aria-labelledby="bkH"><h2 id="bkH">Cadangan data</h2><p class="muted">Data tersimpan di browser perangkat ini saja. Unduh cadangan berkala, atau untuk memindahkan data ke perangkat lain.</p>' + pend +
      '<div class="row-wrap"><button type="button" class="btn alt sm" data-act="export">' + ico("down") + 'Unduh cadangan</button><button type="button" class="btn alt sm" data-act="import">' + ico("up") + 'Pulihkan dari file</button><input type="file" id="impFile" accept="application/json,.json" hidden></div>' +
      (G.msg ? '<p class="muted" role="status">' + esc(G.msg) + "</p>" : "") + "</section></div>";
  }

  /* ---------- Render ---------- */
  var main = document.getElementById("main");
  function fkey(el) { return ["act", "id", "m", "j", "v", "s", "l"].map(function (k) { return el.getAttribute("data-" + k) || ""; }).join("|"); }
  function render(nav) {
    var r = route(), keep = null, ae = document.activeElement;
    if (!nav && ae && main.contains(ae)) { keep = ae.id ? "#" + ae.id : (ae.hasAttribute("data-act") ? fkey(ae) : null); }
    if (nav) stopAll();
    if (r.name === "kuis" && (!Q || Q.id !== r.m.id)) Q = makeQuiz(r.m);
    var html;
    if (r.name === "home") html = vHome();
    else if (r.name === "jilid") html = vJilid(r.j);
    else if (r.name === "materi") html = vMateri(r.m);
    else if (r.name === "kuis") html = vKuis(r.m);
    else html = vGuru();
    main.innerHTML = (memOnly ? '<p class="banner" style="margin-bottom:16px">Penyimpanan browser tidak tersedia. Kemajuan akan hilang saat halaman ditutup.</p>' : "") + html;
    var g = r.name === "guru";
    document.getElementById("navBelajar").setAttribute("aria-current", g ? "false" : "page");
    document.getElementById("navGuru").setAttribute("aria-current", g ? "page" : "false");
    if (g) document.getElementById("navBelajar").removeAttribute("aria-current"); else document.getElementById("navGuru").removeAttribute("aria-current");
    updateSoundBtn();
    document.title = (r.name === "materi" || r.name === "kuis" ? r.m.judul + " · " : r.name === "jilid" ? "Jilid " + r.j + " · " : g ? "Guru · " : "") + "Belajar Abaca";
    if (nav) {
      var h = main.querySelector("h1"); window.scrollTo(0, 0);

    } else if (keep) {
      var els = main.querySelectorAll(keep.charAt(0) === "#" ? keep : "[data-act]"), f = null;
      for (var i = 0; i < els.length; i++) if (keep.charAt(0) === "#" || fkey(els[i]) === keep) { f = els[i]; break; }
      if (f) f.focus({ preventScroll: true });
    }
  }
  window.addEventListener("hashchange", function () { render("focus"); });

  /* ---------- Putar suara ---------- */
  async function playRow(li) {
    var my = ++playId, row = main.querySelector('[data-row="' + li + '"]');
    if (!row) return;
    var toks = Array.prototype.slice.call(row.querySelectorAll(".tok"));
    for (var i = 0; i < toks.length; i++) {
      if (my !== playId) break;
      toks.forEach(function (t) { t.classList.remove("on"); });
      toks[i].classList.add("on");
      await say(toks[i].getAttribute("data-s")); await wait(150);
    }
    toks.forEach(function (t) { t.classList.remove("on"); });
  }
  async function playAll() {
    var my = ++playId, rows = main.querySelectorAll("[data-row]");
    for (var r = 0; r < rows.length; r++) {
      var toks = Array.prototype.slice.call(rows[r].querySelectorAll(".tok"));
      for (var i = 0; i < toks.length; i++) {
        if (my !== playId) { toks.forEach(function (t) { t.classList.remove("on"); }); return; }
        toks.forEach(function (t) { t.classList.remove("on"); });
        toks[i].classList.add("on");
        await say(toks[i].getAttribute("data-s")); await wait(150);
      }
      toks.forEach(function (t) { t.classList.remove("on"); });
      await wait(350);
    }
  }
  function askQuestion() { if (TTS && store.suara && Q && !Q.done) { var a = Q.items[Q.i].ans; setTimeout(function () { say(a); }, 250); } }

  /* ---------- Aksi ---------- */
  function find(id) { return store.siswa.find(function (s) { return s.id === id; }); }
  function touch(s) { s.diperbarui = new Date().toISOString(); }
  function download(name, text) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { return false; }
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), r = route(), s = id ? find(id) : null;
    switch (act) {
      case "pilih": store.aktif = id || null; save(); render(false); break;
      case "tok": {
        playId++;
        Array.prototype.forEach.call(main.querySelectorAll(".tok.on"), function (t) { t.classList.remove("on"); });
        if (b.classList.contains("tok")) b.classList.add("on");
        say(b.getAttribute("data-s")).then(function () { b.classList.remove("on"); });
        break;
      }
      case "playrow": playRow(+b.getAttribute("data-l")); break;
      case "playall": playAll(); break;
      case "newlines": if (r.m) { stopAll(); LINES[r.m.id] = makeLines(r.m.j, r.m); var rows = document.getElementById("rows"); if (rows) rows.innerHTML = rowsHtml(r.m); } break;
      case "sudah": if (r.m) { giveStar(r.m.id, 1); render(false); announce("Bintang didapat"); } break;
      case "quiz": if (r.m) {
        stopAll(); Q = makeQuiz(r.m);
        var target = "#/kuis/" + r.m.id;
        if (location.hash !== target) location.hash = target; else render("focus");
        setTimeout(askQuestion, 100);
      } break;
      case "replay": if (Q) say(Q.items[Q.i].ans); break;
      case "hint": if (Q) { Q.hint = true; render(false); } break;
      case "opt": if (Q && !Q.solved) {
        var v = b.getAttribute("data-v"), it = Q.items[Q.i];
        if (v === it.ans) { Q.solved = true; if (!Q.wrongThis) Q.score++; render(false); announce("Benar!"); say(it.ans); }
        else { Q.wrongThis = true; Q.wrong[v] = true; render(false); announce("Belum tepat, coba lagi."); }
      } break;
      case "next": if (Q) {
        if (Q.i === 4) { Q.done = true; var st = starsFromScore(Q.score); if (st) giveStar(Q.id, st); render("focus"); announce("Selesai. Nilai " + Q.score + " dari 5."); }
        else { Q.i++; Q.solved = false; Q.wrongThis = false; Q.wrong = {}; Q.hint = false; render("focus"); askQuestion(); }
      } break;
      case "toggle": G.open = G.open === id ? null : id; if (G.open) { var p = s && posisi(s); G.j = p ? p.j : 1; } G.del = null; G.clear = null; render(false); break;
      case "tab": G.j = +b.getAttribute("data-j"); G.clear = null; render(false); break;
      case "chip": if (s) { var mid = b.getAttribute("data-m"), nv = ((s.nilai[mid] || 0) + 1) % 3; if (nv === 0) delete s.nilai[mid]; else s.nilai[mid] = nv; touch(s); save(); render(false); } break;
      case "allok": if (s) { BY_J[G.j].forEach(function (m) { s.nilai[m.id] = 2; }); touch(s); save(); render(false); } break;
      case "clear": G.clear = id + ":" + G.j; render(false); break;
      case "clearno": G.clear = null; render(false); break;
      case "clearyes": if (s) { BY_J[G.j].forEach(function (m) { delete s.nilai[m.id]; }); G.clear = null; touch(s); save(); render(false); } break;
      case "del": G.del = id; render(false); break;
      case "delno": G.del = null; render(false); break;
      case "delyes": store.siswa = store.siswa.filter(function (x) { return x.id !== id; }); if (store.aktif === id) store.aktif = null; if (G.open === id) G.open = null; G.del = null; save(); render(false); break;
      case "export": {
        G.msg = download("abaca-cadangan-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify({ aplikasi: "belajar-abaca", versi: 2, siswa: store.siswa }, null, 2)) ? "Cadangan diunduh." : "Browser ini menolak unduhan. Coba buka lewat browser biasa.";
        render(false); break;
      }
      case "import": document.getElementById("impFile").click(); break;
      case "impyes": if (G.pending) { store.siswa = G.pending.siswa; store.aktif = null; G.pending = null; G.open = null; G.msg = "Data dipulihkan."; save(); render(false); } break;
      case "impno": G.pending = null; render(false); break;
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains("note")) {
      var s = find(t.getAttribute("data-id")); if (!s) return;
      var v = t.value.trim().slice(0, 200); if (v === s.catatan) return;
      s.catatan = v; touch(s); save(); render(false);
    } else if (t.id === "impFile" && t.files && t.files[0]) {
      var rd = new FileReader();
      rd.onload = function () {
        try {
          var o = JSON.parse(String(rd.result)), list = Array.isArray(o) ? o : o.siswa;
          if (!Array.isArray(list)) throw new Error("bentuk");
          var seen = {}, out = [];
          list.forEach(function (x) { var n = normS(x); if (!seen[n.id]) { seen[n.id] = 1; out.push(n); } });
          G.pending = { siswa: out }; G.msg = "";
        } catch (err) { G.pending = null; G.msg = "File tidak dikenali. Pilih file cadangan dari aplikasi ini."; }
        render(false);
      };
      rd.onerror = function () { G.msg = "File tidak bisa dibaca."; render(false); };
      rd.readAsText(t.files[0]);
      t.value = "";
    }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "addForm") return;
    e.preventDefault();
    var inp = document.getElementById("newName"), nama = inp.value.trim();
    if (!nama) { G.err = "Tulis nama siswa dulu."; render(false); document.getElementById("newName").focus(); return; }
    G.err = "";
    var s = normS({ nama: nama }); store.siswa.push(s); save(); G.open = null;
    G.msg = ""; render(false);
    var ni = document.getElementById("newName"); if (ni) ni.focus();
    announce(nama + " ditambahkan");
  });
  document.addEventListener("input", function (e) { if (e.target.id === "newName" && G.err) { G.err = ""; var er = document.getElementById("nameErr"); if (er) er.remove(); e.target.removeAttribute("aria-invalid"); } });
  soundBtn.addEventListener("click", function () { store.suara = !store.suara; stopAll(); save(); updateSoundBtn(); });

  load();
  render(false);
})();
</script>
</body>
